buildscript {
    ext.kotlinVersion = '2.4.21'
    ext.coroutineVersion = '1.9.0'

    ext.appcompatVersion = '1.7.0'
    ext.fragmentVersion = '1.8.5'
    ext.lifecycleVersion = '2.8.7'
    ext.navigationVersion = '2.8.5'
    ext.preferenceVersion = '1.2.1'
    ext.recyclerviewVersion = '1.3.2'

    ext.androidBuildGradleVersion = '9.4.1'

    ext.androidMinSdk = 21
    ext.androidTargetSdk = 29
    ext.androidCompileSdk = 36

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$androidBuildGradleVersion"
        classpath "com.android.tools.build:gradle-kotlin:$androidBuildGradleVersion"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlinVersion"
    }
}

String gitDescribeVersion() {
    def args = ['git', 'describe', '--tags', '--always']
    // Automatic build systems have no gradlew. Do not tag their builds as dirty.
    if (rootProject.file("gradlew").exists()) args += '--dirty'
    return providers.exec { commandLine args }.standardOutput.asText.get().trim().substring(1)
}

int gitCountCommits() {
    def stdout = providers.exec { commandLine 'git', 'rev-list', '--count', 'HEAD' }.standardOutput.asText.get()
    return Integer.parseInt(stdout.trim())
}

allprojects {
    apply plugin: 'idea'

    group = 'org.microg.nlp'
    version = gitDescribeVersion()
    ext.appVersionCode = gitCountCommits()

    gradle.projectsEvaluated {
        tasks.withType(JavaCompile) {
            options.compilerArgs << "-Xlint:deprecation"
        }
    }
}

subprojects {
    repositories {
        google()
        mavenCentral()
    }
}
